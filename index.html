function navigate(route) {

    window.location.hash =
        route;

}


function getRoute() {

    return (
        window.location.hash.replace("#","")
        || "/"
    );

}


window.addEventListener(
    "hashchange",
    router
);


async function router() {

    const route =
        getRoute();

    window.scrollTo(
        0,
        0
    );


    if(route === "/") {

        renderHome();

    }

    else if(route === "/products") {

        await renderProducts();

    }

    else if(route.startsWith("/product/")) {

        const id =
            route.split("/")[2];

        await renderProductDetails(id);

    }

    else if(route === "/cart") {

        await renderCart();

    }

    else if(route === "/wishlist") {

        await renderWishlist();

    }

    else if(route === "/about") {

        renderAbout();

    }

    else if(route === "/contact") {

        renderContact();

    }

    else {

        render404();

    }


    updateBadges();

}

/* =====================================================
   FETCH PRODUCTS
===================================================== */

async function fetchProducts() {

    if(products.length > 0) {

        return products;

    }


    const response =
        await fetch(API_URL);


    if(!response.ok) {

        throw new Error(
            "Unable to load products."
        );

    }


    const data =
        await response.json();


    products =
        data.products;


    return products;

}

/* =====================================================
   CATEGORY FILTER
===================================================== */

function filterCategory(category) {

    const filtered =

    category === "all"

    ? products

    : products.filter(

        product =>
            product.category === category

    );


    renderProductGrid(filtered);

}


/* =====================================================
   SEARCH & SORT
===================================================== */

function filterProducts() {

    const search =
        document
        .getElementById("searchInput")
        .value
        .toLowerCase();


    const sort =
        document
        .getElementById("sortSelect")
        .value;


    let filtered =

    products.filter(

        product =>

        product.title
        .toLowerCase()
        .includes(search)

    );


    if(sort === "low") {

        filtered.sort(

            (a,b) =>
                a.price - b.price

        );

    }


    if(sort === "high") {

        filtered.sort(

            (a,b) =>
                b.price - a.price

        );

    }


    renderProductGrid(filtered);

}

/* =====================================================
   CART
===================================================== */

function addToCart(id) {

    const existing =
        cart.find(
            item =>
                item.id === id
        );


    if(existing) {

        existing.quantity++;

    }

    else {

        cart.push({

            id:
                id,

            quantity:
                1

        });

    }


    saveCart();

    updateBadges();

    alert(
        "🛒 Product added to your cart!"
    );

}


async function renderCart() {

    await fetchProducts();


    const cartProducts =

    cart.map(

        item => {

            const product =
                products.find(
                    p =>
                        p.id === item.id
                );


            return {

                ...product,

                quantity:
                    item.quantity

            };

        }

    );


    if(!cartProducts.length) {

        app.innerHTML = `

        <section class="page">

        <div class="empty">

        <h2>
        🛒 Your Cart is Empty
        </h2>

        <br>

        <button
        class="btn btn-primary"
        onclick="navigate('/products')">

        Start Shopping

        </button>

        </div>

        </section>

        `;

        return;

    }


    let total = 0;


    app.innerHTML = `

    <section class="page">

    <div class="section-title">

    <h2>
    🛒 Shopping Cart
    </h2>

    </div>


    <div class="cart-layout">

    <div class="cart-items">

    ${cartProducts.map(

        product => {

            total +=
                product.price *
                product.quantity;


            return `

            <div class="cart-item">

            <img
            src="${product.thumbnail}"
            alt="${product.title}">


            <div>

            <strong>

            ${product.title}

            </strong>

            <p>

            ₹${Math.round(
                product.price * 83
            )}

            </p>


            <div class="quantity">

            <button
            onclick="changeQuantity(${product.id},-1)">

            −

            </button>


            <span>

            ${product.quantity}

            </span>


            <button
            onclick="changeQuantity(${product.id},1)">

            +

            </button>

            </div>

            </div>


            <button
            class="btn btn-danger"
            onclick="removeFromCart(${product.id})">

            Remove

            </button>

            </div>

            `;

        }

    ).join("")}

    </div>


    <div class="cart-summary">

    <h2>
    Order Summary
    </h2>


    <div class="summary-row">

    <span>
    Total Items
    </span>

    <strong>

    ${cart.reduce(
        (sum,item) =>
            sum + item.quantity,
        0
    )}

    </strong>

    </div>


    <div class="summary-row">

    <span>
    Total
    </span>

    <strong>

    ₹${Math.round(
        total * 83
    )}

    </strong>

    </div>


    <br>


    <button
    class="btn btn-primary"
    style="width:100%"
    onclick="checkout()">

    Proceed to Checkout

    </button>

    </div>

    </div>

    </section>

    `;

}


function changeQuantity(id,amount) {

    const item =
        cart.find(
            item =>
                item.id === id
        );


    if(!item) return;


    item.quantity += amount;


    if(item.quantity <= 0) {

        cart =
            cart.filter(
                item =>
                    item.id !== id
            );

    }


    saveCart();

    renderCart();

}


function removeFromCart(id) {

    cart =
        cart.filter(
            item =>
                item.id !== id
        );


    saveCart();

    renderCart();

}


function saveCart() {

    localStorage.setItem(

        "novacart_cart",

        JSON.stringify(cart)

    );

}


function checkout() {

    alert(
        "✅ Demo checkout completed successfully!"
    );

}

===================================================== */

function toggleWishlist(id) {

    if(
        wishlist.includes(id)
    ) {

        wishlist =
            wishlist.filter(
                item =>
                    item !== id
            );

    }

    else {

        wishlist.push(id);

    }


    localStorage.setItem(

        "novacart_wishlist",

        JSON.stringify(wishlist)

    );


    updateBadges();


    if(
        getRoute() === "/products"
    ) {

        renderProductGrid(
            products
        );

    }


    if(
        getRoute() === "/wishlist"
    ) {

        renderWishlist();

    }

}
